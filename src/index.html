<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LAOPS RELOADED</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    (function () {
      var theme = 'auto';
      try { theme = localStorage.getItem('laops.theme') || 'auto'; } catch (e) {}
      var useDark = theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.body.classList.add(useDark ? 'laops-dark-theme' : 'laops-light-theme');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
