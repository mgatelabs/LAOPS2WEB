@if (hasMultiSelection()) {
  <div class="bulk-bar">
    <button mat-icon-button [matTooltip]="'LAYERS.TO_FRONT' | translate"
            (click)="store.toFront(store.selection())">
      <mat-icon>flip_to_front</mat-icon>
    </button>
    <button mat-icon-button [matTooltip]="'LAYERS.TO_BACK' | translate"
            (click)="store.toBack(store.selection())">
      <mat-icon>flip_to_back</mat-icon>
    </button>
    <button mat-icon-button [matTooltip]="'LAYERS.HIDE_SELECTED' | translate"
            (click)="store.setVisibility(store.selection(), false)">
      <mat-icon>visibility_off</mat-icon>
    </button>
    <button mat-icon-button color="warn" [matTooltip]="'LAYERS.DELETE_SELECTED' | translate"
            (click)="deleteSelected()">
      <mat-icon>delete</mat-icon>
    </button>
  </div>
}

<div class="row-list">
  @if (displayNodes().length === 0) {
    <div class="empty-row">{{ 'LAYERS.EMPTY' | translate }}</div>
  }

  @for (node of displayNodes(); track node.id) {
    <div class="layer-row"
         [class.selected]="isSelected(node.id)"
         [class.locked]="node.locked"
         [class.hidden]="node.visible === false"
         (click)="onRowClick($event, node)">

      <mat-checkbox
        [checked]="isSelected(node.id)"
        (click)="$event.stopPropagation()"
        (change)="store.toggleSelected(node.id)" />

      <button mat-icon-button class="icon-btn"
              [matTooltip]="(node.visible !== false ? 'LAYERS.HIDE_SELECTED' : 'LAYERS.SHOW_SELECTED') | translate"
              (click)="toggleVisibility($event, node)">
        <mat-icon>{{ node.visible !== false ? 'visibility' : 'visibility_off' }}</mat-icon>
      </button>

      <button mat-icon-button class="icon-btn"
              [matTooltip]="(node.locked ? 'LAYERS.UNLOCK_SELECTED' : 'LAYERS.LOCK_SELECTED') | translate"
              (click)="toggleLock($event, node)">
        <mat-icon>{{ node.locked ? 'lock' : 'lock_open' }}</mat-icon>
      </button>

      <mat-icon class="type-icon">{{ typeIcon(node) }}</mat-icon>

      <span class="row-label">{{ node.label }}</span>

      <div class="reorder-btns">
        <button mat-icon-button class="icon-btn reorder-btn"
                [matTooltip]="'PROPS.MOVE_UP' | translate"
                (click)="moveUp($event, node)">
          <mat-icon>keyboard_arrow_up</mat-icon>
        </button>
        <button mat-icon-button class="icon-btn reorder-btn"
                [matTooltip]="'PROPS.MOVE_DOWN' | translate"
                (click)="moveDown($event, node)">
          <mat-icon>keyboard_arrow_down</mat-icon>
        </button>
      </div>
    </div>
  }
</div>
