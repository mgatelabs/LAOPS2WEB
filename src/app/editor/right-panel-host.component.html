<div class="accordion">
  @for (panel of panels; track panel.id) {
    <div class="accordion-section" [class.open]="isOpen(panel.id)">
      <button class="accordion-header" (click)="toggle(panel.id)" type="button">
        <mat-icon class="chevron">{{ isOpen(panel.id) ? 'expand_more' : 'chevron_right' }}</mat-icon>
        <span class="accordion-label">{{ panel.labelKey | translate }}</span>
        <span class="accordion-actions" (click)="$event.stopPropagation()">
          @if (panel.id === 'layers') {
            <button mat-icon-button class="header-action-btn"
                    [matTooltip]="'LAYERS.SELECT_ALL' | translate"
                    (click)="onSelectAll()">
              <mat-icon>select_all</mat-icon>
            </button>
          }
        </span>
      </button>
      <div class="accordion-body" [class.open]="isOpen(panel.id)">
        @switch (panel.id) {
          @case ('properties') { <app-properties-panel /> }
          @case ('transform')  { <app-transform-panel /> }
          @case ('layers')     { <app-layers-panel /> }
          @case ('assets')     { <app-asset-panel /> }
          @case ('scenes')     { <app-scene-panel /> }
        }
      </div>
    </div>
  }
</div>
